name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - server.yml
          - desktop-aorus.yml
        platform: [linux/amd64, linux/arm64]
        exclude:
          - recipe: desktop-aorus.yml
            platform: linux/arm64
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          build_opts: "--platform ${{ matrix.platform }}"
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

  merge:
    name: Merge multiarch manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: bluebuild
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        recipe: [server.yml]
    steps:
      - name: Login to GHCR
        run: echo "${{ github.token }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Stitch per-arch tags into one manifest list
        run: |
          name=$(basename ${{ matrix.recipe }} .yml)
          img=ghcr.io/ethernium/${name}
          podman manifest create ${img}:latest
          podman manifest add ${img}:latest docker://${img}:latest_linux_amd64
          podman manifest add ${img}:latest docker://${img}:latest_linux_arm64
          podman manifest push ${img}:latest
