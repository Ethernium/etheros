name: Build Custom Image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Custom Image (${{ matrix.recipe }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: [server.yml, desktop-aorus.yml]
        platform: [linux/amd64, linux/arm64]
        exclude:
          - recipe: desktop-aorus.yml
            platform: linux/arm64
        include:
          - platform: linux/amd64
            tag: linux_amd64
          - platform: linux/arm64
            tag: linux_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Custom Image
        id: bluebuild
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          build_opts: "--platform ${{ matrix.platform }} --tag latest_${{ matrix.tag }}"

  merge:
    name: Merge multiarch manifest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Stitch dual-arch index for etheros-server:latest
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/ethernium/etheros-server
          podman manifest rm ${img}:latest 2>/dev/null || true
          podman manifest create ${img}:latest
          podman manifest add ${img}:latest docker://${img}:latest_linux_amd64
          podman manifest add ${img}:latest docker://${img}:latest_linux_arm64
          podman manifest push ${img}:latest
          # must print: Wrote ... to image destination
